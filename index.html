<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="程序员鱼皮的个人电子名片：程序员 / AI 编程博主，前腾讯全栈开发，现自主创业。"
    />
    <title>程序员鱼皮 | 个人电子名片</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --bg-strong: #ffffff;
        --ink: #172033;
        --muted: #5e6b7f;
        --line: rgba(23, 32, 51, 0.12);
        --accent: #2563eb;
        --accent-2: #14b8a6;
        --accent-ink: #ffffff;
        --chip: rgba(37, 99, 235, 0.09);
        --shadow: 0 24px 80px rgba(24, 38, 64, 0.14);
      }

      [data-theme="terminal"] {
        color-scheme: dark;
        --bg: #0f1519;
        --bg-strong: #151d22;
        --ink: #eef6f1;
        --muted: #a7b6ad;
        --line: rgba(215, 241, 227, 0.14);
        --accent: #39d98a;
        --accent-2: #60a5fa;
        --accent-ink: #07120c;
        --chip: rgba(57, 217, 138, 0.12);
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      }

      [data-theme="aqua"] {
        color-scheme: light;
        --bg: #eef8f9;
        --bg-strong: #fbffff;
        --ink: #123139;
        --muted: #567178;
        --line: rgba(18, 49, 57, 0.14);
        --accent: #0891b2;
        --accent-2: #16a34a;
        --accent-ink: #ffffff;
        --chip: rgba(8, 145, 178, 0.11);
        --shadow: 0 24px 80px rgba(17, 94, 89, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 32rem),
          radial-gradient(circle at 84% 82%, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent 30rem),
          linear-gradient(135deg, var(--bg), color-mix(in srgb, var(--bg) 84%, var(--accent-2)));
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", "PingFang SC", sans-serif;
        letter-spacing: 0;
      }

      button,
      a {
        font: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page-shell {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
        color: var(--ink);
      }

      .card {
        position: relative;
        display: grid;
        grid-template-columns: minmax(260px, 0.9fr) minmax(360px, 1.1fr);
        gap: 34px;
        width: min(1060px, 100%);
        min-height: 620px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--bg-strong) 94%, transparent);
        box-shadow: var(--shadow);
      }

      .card::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 38px 38px;
        mask-image: linear-gradient(120deg, transparent 0%, black 18%, transparent 74%);
        opacity: 0.35;
        content: "";
      }

      .profile-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
        padding: 34px;
        background:
          linear-gradient(160deg, color-mix(in srgb, var(--accent) 13%, transparent), transparent 46%),
          color-mix(in srgb, var(--bg-strong) 88%, var(--accent));
        border-right: 1px solid var(--line);
      }

      .avatar-frame {
        display: grid;
        width: min(100%, 320px);
        aspect-ratio: 1;
        place-items: center;
        margin-inline: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(145deg, color-mix(in srgb, var(--bg-strong) 86%, var(--accent)), var(--bg-strong));
      }

      .avatar-frame img {
        display: block;
        width: 88%;
        height: 88%;
        object-fit: contain;
      }

      .status-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 32px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--chip);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.2;
      }

      .content-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 28px;
        padding: 36px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 650;
      }

      .pulse {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--accent-2);
        box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent-2) 18%, transparent);
      }

      .theme-switcher {
        display: inline-flex;
        gap: 6px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--bg-strong) 82%, transparent);
      }

      .theme-button {
        display: inline-grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .theme-button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
      }

      .hero-copy {
        display: grid;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 8vw, 78px);
        line-height: 0.96;
        letter-spacing: 0;
      }

      .role {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0;
        color: var(--accent);
        font-size: clamp(19px, 3vw, 28px);
        font-weight: 780;
      }

      .intro {
        max-width: 660px;
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.78;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        min-height: 82px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--bg-strong) 88%, transparent);
      }

      .metric strong {
        display: block;
        color: var(--ink);
        font-size: 19px;
        line-height: 1.2;
      }

      .metric span {
        display: block;
        margin-top: 7px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--bg-strong) 92%, transparent);
        color: var(--ink);
        cursor: pointer;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .action:hover {
        transform: translateY(-1px);
        border-color: color-mix(in srgb, var(--accent) 52%, var(--line));
      }

      .action.primary {
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-ink);
      }

      .icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .toast {
        min-height: 22px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 650;
      }

      @media (max-width: 820px) {
        .page-shell {
          padding: 18px;
          place-items: start center;
        }

        .card {
          grid-template-columns: 1fr;
          min-height: auto;
        }

        .profile-panel {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: 24px;
        }

        .avatar-frame {
          width: min(74vw, 280px);
        }

        .content-panel {
          padding: 24px;
        }

        .topbar {
          align-items: flex-start;
        }

        .metrics {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 460px) {
        .page-shell {
          padding: 10px;
        }

        .profile-panel,
        .content-panel {
          padding: 18px;
        }

        .theme-switcher {
          flex-shrink: 0;
        }

        .actions {
          display: grid;
          grid-template-columns: 1fr;
        }

        .action {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      const { useMemo, useState } = React;

      const themes = [
        { id: "light", label: "浅色科技", icon: "Sun" },
        { id: "terminal", label: "深色终端", icon: "Terminal" },
        { id: "aqua", label: "清爽蓝绿", icon: "Droplets" }
      ];

      const icons = {
        Sun: [
          ["circle", { cx: 12, cy: 12, r: 4 }],
          ["path", { d: "M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" }]
        ],
        Terminal: [
          ["path", { d: "m7 8 4 4-4 4" }],
          ["path", { d: "M12 16h5" }],
          ["rect", { x: 3, y: 4, width: 18, height: 16, rx: 2 }]
        ],
        Droplets: [
          ["path", { d: "M7 16.3c-1.9 0-3.5-1.5-3.5-3.4 0-2.4 3.5-6.2 3.5-6.2s3.5 3.8 3.5 6.2c0 1.9-1.6 3.4-3.5 3.4Z" }],
          ["path", { d: "M17 20c-1.7 0-3-1.3-3-3 0-2 3-5.2 3-5.2s3 3.2 3 5.2c0 1.7-1.3 3-3 3Z" }]
        ],
        Github: [
          ["path", { d: "M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.1-1.4-.4-2.7-1.3-3.7.1-.4.5-1.9-.1-3.3 0 0-1.1-.3-3.5 1.3a12.1 12.1 0 0 0-6.2 0C6.5 1.7 5.4 2 5.4 2c-.6 1.4-.2 2.9-.1 3.3A5.3 5.3 0 0 0 4 9.5C4 13 7 15 10 15a4.8 4.8 0 0 0-1 3.5V22" }],
          ["path", { d: "M9 18c-4.5 2-5-2-7-2" }]
        ],
        Globe: [
          ["circle", { cx: 12, cy: 12, r: 10 }],
          ["path", { d: "M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20" }]
        ],
        Copy: [
          ["rect", { x: 9, y: 9, width: 13, height: 13, rx: 2 }],
          ["path", { d: "M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" }]
        ]
      };

      function Icon({ name }) {
        return React.createElement(
          "svg",
          { className: "icon", viewBox: "0 0 24 24", "aria-hidden": "true" },
          icons[name].map(([tag, attrs], index) => React.createElement(tag, { ...attrs, key: index }))
        );
      }

      function App() {
        const [theme, setTheme] = useState("light");
        const [toast, setToast] = useState("");

        const contacts = useMemo(
          () => [
            { label: "GitHub", value: "liyupi", href: "https://github.com/liyupi", icon: "Github" },
            { label: "网站", value: "codefather.cn", href: "https://codefather.cn", icon: "Globe" }
          ],
          []
        );

        async function copyText(text, label) {
          try {
            await navigator.clipboard.writeText(text);
            setToast(`${label} 已复制`);
          } catch (error) {
            setToast(`请手动复制：${text}`);
          }
          window.clearTimeout(copyText.timer);
          copyText.timer = window.setTimeout(() => setToast(""), 2600);
        }

        return React.createElement(
          "main",
          { className: "page-shell", "data-theme": theme },
          React.createElement(
            "section",
            { className: "card", "aria-label": "程序员鱼皮个人电子名片" },
            React.createElement(
              "aside",
              { className: "profile-panel" },
              React.createElement(
                "div",
                { className: "avatar-frame" },
                React.createElement("img", {
                  src: "assets/avatar-programmer.png",
                  alt: "程序员鱼皮卡通程序员头像"
                })
              ),
              React.createElement(
                "div",
                { className: "status-strip", "aria-label": "个人标签" },
                ["全栈开发", "AI 编程", "创业中", "产品共建"].map((tag) =>
                  React.createElement("span", { className: "status-chip", key: tag }, tag)
                )
              )
            ),
            React.createElement(
              "div",
              { className: "content-panel" },
              React.createElement(
                "div",
                { className: "topbar" },
                React.createElement(
                  "span",
                  { className: "eyebrow" },
                  React.createElement("span", { className: "pulse", "aria-hidden": "true" }),
                  "个人电子名片"
                ),
                React.createElement(
                  "div",
                  { className: "theme-switcher", "aria-label": "主题切换" },
                  themes.map((item) =>
                    React.createElement(
                      "button",
                      {
                        className: "theme-button",
                        key: item.id,
                        type: "button",
                        title: item.label,
                        "aria-label": item.label,
                        "aria-pressed": theme === item.id,
                        onClick: () => setTheme(item.id)
                      },
                      React.createElement(Icon, { name: item.icon })
                    )
                  )
                )
              ),
              React.createElement(
                "div",
                { className: "hero-copy" },
                React.createElement("h1", null, "程序员鱼皮"),
                React.createElement("p", { className: "role" }, "程序员", React.createElement("span", null, "/"), "AI 编程博主"),
                React.createElement(
                  "p",
                  { className: "intro" },
                  "前腾讯全栈开发，现自主创业，带团队开发了程序员导航、面试鸭、鱼皮 AI 导航等产品。"
                )
              ),
              React.createElement(
                "div",
                { className: "metrics", "aria-label": "经历摘要" },
                [
                  ["腾讯背景", "全栈研发经验"],
                  ["AI 编程", "分享工具与实践"],
                  ["产品团队", "持续打造开发者产品"]
                ].map(([title, text]) =>
                  React.createElement(
                    "div",
                    { className: "metric", key: title },
                    React.createElement("strong", null, title),
                    React.createElement("span", null, text)
                  )
                )
              ),
              React.createElement(
                "div",
                null,
                React.createElement(
                  "div",
                  { className: "actions" },
                  contacts.map((contact, index) =>
                    React.createElement(
                      "a",
                      {
                        className: `action ${index === 0 ? "primary" : ""}`,
                        key: contact.label,
                        href: contact.href,
                        target: "_blank",
                        rel: "noopener noreferrer"
                      },
                      React.createElement(Icon, { name: contact.icon }),
                      `${contact.label}：${contact.value}`
                    )
                  ),
                  contacts.map((contact) =>
                    React.createElement(
                      "button",
                      {
                        className: "action",
                        key: `copy-${contact.label}`,
                        type: "button",
                        onClick: () => copyText(contact.value, contact.label)
                      },
                      React.createElement(Icon, { name: "Copy" }),
                      `复制${contact.label}`
                    )
                  )
                ),
                React.createElement("div", { className: "toast", role: "status", "aria-live": "polite" }, toast)
              )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
  </body>
</html>
